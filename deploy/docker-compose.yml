# Окружение РАЗРАБОТКИ. Production-конфигурация (Nginx, HTTPS, бэкапы) — Sprint 11.
# Запуск из корня репозитория:  docker compose -f deploy/docker-compose.yml up -d --build
# Только инфраструктура для локального dotnet run / npm run dev:
#   docker compose -f deploy/docker-compose.yml up -d db mailpit
# Значения по умолчанию ниже — только для локальной разработки; переопределяются в deploy/.env.
name: hms

x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__Hms: Host=db;Port=5432;Database=${POSTGRES_DB:-hms};Username=${POSTGRES_USER:-hms};Password=${POSTGRES_PASSWORD:-hms_dev_only};GSS Encryption Mode=Disable
  Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-do-not-use-in-production-0123456789}
  Identity__PublicWebUrl: ${PUBLIC_WEB_URL:-http://localhost:3000}
  Email__Host: mailpit
  Email__Port: "1025"
  Email__Security: None
  Bootstrap__Owner__FullName: ${OWNER_FULL_NAME:-Владелец (разработка)}
  Bootstrap__Owner__Email: ${OWNER_EMAIL:-owner@hms.local}
  Bootstrap__Owner__Password: ${OWNER_PASSWORD:-owner-dev-password}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hms}
      POSTGRES_USER: ${POSTGRES_USER:-hms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hms_dev_only}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Перехватчик писем для разработки: SMTP 1025, веб-интерфейс http://localhost:8025
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  migrate:
    # Одноразово: миграции + сидеры (роли, права, первый владелец). Так же — при релизе в production.
    build: ../backend
    command: ["migrate"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ../backend
    environment:
      <<: *api-env
      # API доступен только из docker-сети и localhost; X-Forwarded-For приходит от web (BFF).
      ForwardedHeaders__TrustAllProxies: "true"
      # Попыток входа/регистрации в минуту с одного IP (в CI для E2E повышается).
      RateLimiting__AuthStrictPerMinute: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - api-files:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ../frontend
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  db-data:
  api-files:
