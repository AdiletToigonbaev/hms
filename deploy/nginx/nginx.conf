# Nginx HMS (production). Сайт гостиницы и кабинеты — через Next.js (web);
# к API снаружи доступны только вебхуки (/api/v1/webhooks/). См. docs/development/deployment.md.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Журнал запросов в JSON. Пишется $uri, а не $request_uri: в query бывают токены
    # (подтверждение email, сброс пароля) — им не место в логах. Referer не пишется по той же причине.
    log_format hms_json escape=json
        '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"host":"$host","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log hms_json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    # Next.js сжимает сам; gzip здесь — для ответов, которые пришли без сжатия.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    # TLS — общий для сайта и редиректа с дополнительных имён (www). Профиль Mozilla «intermediate».
    # OCSP stapling не включён: Let's Encrypt прекратил OCSP в 2025 г.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Ограничения по IP — только защита от флуда. Весь персонал гостиницы выходит в интернет
    # с одного IP (Wi-Fi стойки), гости мобильных операторов делят адреса (CGNAT), а меню кабинета
    # заранее подгружает все разделы разом. Поэтому лимиты щедрые; точные лимиты входа и
    # бронирования — в API (на IP и на аккаунт). Проверено E2E в 4 потока с одного IP: пики до ~150 запросов страниц в секунду.
    # limit_conn при HTTP/2 считает одновременные запросы (потоки), а не TCP-соединения.
    limit_req_zone $binary_remote_addr zone=site:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=10r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
