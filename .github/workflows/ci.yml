name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, format, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore Hms.sln
      - name: Build
        run: dotnet build Hms.sln -c Release --no-restore
      - name: Format check
        run: dotnet format Hms.sln --verify-no-changes --no-restore
      - name: Tests (unit, API, architecture, integration via Testcontainers)
        run: dotnet test --solution Hms.sln -c Release --no-build

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Docker stack + E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      AUTH_RATE_LIMIT_PER_MINUTE: "1000"
    steps:
      - uses: actions/checkout@v7
      - name: Build and start stack (db, mailpit, migrate, api, web)
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 300 db mailpit api web
      - name: API readiness
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:5080/health/ready && exit 0; sleep 2; done
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  production:
    name: Production stack (nginx + HTTPS, E2E, backup/restore, load smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      AUTH_RATE_LIMIT_PER_MINUTE: "1000"
    steps:
      - uses: actions/checkout@v7
      # Тот же docker-compose.prod.yml, что на сервере; домен localhost, самоподписанный сертификат, Mailpit.
      - name: Build and start production stack
        run: ./deploy/prod-local-check.sh up
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E over HTTPS through nginx
        working-directory: frontend
        env:
          E2E_BASE_URL: https://localhost
          E2E_IGNORE_HTTPS_ERRORS: "1"
          E2E_OWNER_INITIAL_PASSWORD: owner-prod-local-password
        run: npm run test:e2e
      - name: Backup → restore check
        run: ./deploy/prod-local-check.sh backup-check
      - name: Load smoke (k6)
        run: |
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' hms-prod-nginx-1)
          docker run --rm -i --network hms-prod_default -e BASE_URL=https://localhost -e TARGET_IP="$ip" -e INSECURE=1 \
            grafana/k6:2.4.0 run --quiet - < deploy/loadtest/smoke.js
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p hms-prod logs --no-color
      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-production
          path: frontend/test-results
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks CLI из закреплённого образа: читаемые логи, без лицензии gitleaks-action, вся история
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose
